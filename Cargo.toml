[workspace]
resolver = "2"
members = [
  "crates/halflife-core",
  "crates/halflife-lineage",
  "crates/halflife-registry",
  "crates/halflife-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bs58 = "0.5"
toml = "0.8"
ed25519-dalek = "2"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
