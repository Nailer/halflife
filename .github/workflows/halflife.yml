name: halflife

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify the system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1

      # The benchmark needs the compiled Solana programs, which CI does not
      # build, so it is excluded here and run by scripts/verify-all.sh locally.
      - name: Build
        run: cargo build --release --locked --workspace --exclude halflife-bench

      - name: Unit tests
        run: cargo test --release --locked --workspace --exclude halflife-bench

      # The format is the contract between four runtimes. A decoder checked only
      # against its own encoder will happily agree with a mistake, so both
      # implementations run.
      - name: Conformance, Rust
        run: ./target/release/halflife vectors verify fixtures/vectors.json

      - name: Conformance, independent Node implementation
        run: node packages/passport-ts/verify-vectors.mjs fixtures/vectors.json

      - name: Negative control, a tampered vector must be rejected
        run: bash scripts/ci-negative-control.sh

      - name: EVM destination
        working-directory: evm
        run: |
          forge install foundry-rs/forge-std --no-git
          forge test -vv

  gate:
    name: circuit advisory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        run: cargo build --release --locked -p halflife-cli

      # This is the adoption wedge, and it is tested in both directions: a
      # closure with no advisories must pass, and a closure carrying one must be
      # rejected. A gate that only ever passes proves nothing.
      - name: A clean closure passes
        run: bash scripts/ci-gate.sh pass fixtures/orchard-patched

      - name: A closure carrying an advisory is rejected
        run: bash scripts/ci-gate.sh fail fixtures/orchard-vulnerable

  # The reusable Action, exercised through `uses:` exactly as a user would call
  # it, in both directions. Inputs are lockfiles copied WITHOUT a halflife.toml,
  # which is what a real project looks like and tests the generated manifest.
  action:
    name: reusable action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare lockfile-only inputs
        run: |
          mkdir -p /tmp/in-clean /tmp/in-bad
          cp fixtures/orchard-patched/Cargo.lock /tmp/in-clean/Cargo.lock
          cp fixtures/orchard-vulnerable/Cargo.lock /tmp/in-bad/Cargo.lock

      - name: A clean lockfile passes
        id: clean
        uses: ./
        with:
          path: /tmp/in-clean
          offline: "true"
      - name: Clean run reported clean
        run: test "${{ steps.clean.outputs.status }}" = "clean"

      - name: A lockfile with an advisory is rejected
        id: bad
        uses: ./
        continue-on-error: true
        with:
          path: /tmp/in-bad
          offline: "true"
      - name: The gate must have failed the step
        run: |
          test "${{ steps.bad.outcome }}" = "failure" || { echo "::error::the gate let a vulnerable lockfile through"; exit 1; }
          test "${{ steps.bad.outputs.status }}" = "advisories"

      - name: deny=false reports without failing
        id: soft
        uses: ./
        with:
          path: /tmp/in-bad
          offline: "true"
          deny: "false"
      - name: Soft mode still reported the advisory
        run: test "${{ steps.soft.outputs.status }}" = "advisories"
