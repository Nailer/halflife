name: halflife

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify the system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1

      # The benchmark needs the compiled Solana programs, which CI does not
      # build, so it is excluded here and run by scripts/verify-all.sh locally.
      - name: Build
        run: cargo build --release --locked --workspace --exclude halflife-bench

      - name: Unit tests
        run: cargo test --release --locked --workspace --exclude halflife-bench

      # The format is the contract between four runtimes. A decoder checked only
      # against its own encoder will happily agree with a mistake, so both
      # implementations run.
      - name: Conformance, Rust
        run: ./target/release/halflife vectors verify fixtures/vectors.json

      - name: Conformance, independent Node implementation
        run: node packages/passport-ts/verify-vectors.mjs fixtures/vectors.json

      - name: Negative control, a tampered vector must be rejected
        run: bash scripts/ci-negative-control.sh

      - name: EVM destination
        working-directory: evm
        run: |
          forge install foundry-rs/forge-std --no-git
          forge test -vv

  gate:
    name: circuit advisory gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build the CLI
        run: cargo build --release --locked -p halflife-cli

      # This is the adoption wedge, and it is tested in both directions: a
      # closure with no advisories must pass, and a closure carrying one must be
      # rejected. A gate that only ever passes proves nothing.
      - name: A clean closure passes
        run: bash scripts/ci-gate.sh pass fixtures/orchard-patched

      - name: A closure carrying an advisory is rejected
        run: bash scripts/ci-gate.sh fail fixtures/orchard-vulnerable
