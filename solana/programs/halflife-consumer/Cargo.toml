[package]
name = "halflife-consumer"
version = "0.1.0"
edition = "2021"
description = "Reference consumer: a program that refuses to proceed on a bad passport"

[lib]
crate-type = ["cdylib", "lib"]
name = "halflife_consumer"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
halflife-passport = { path = "../halflife-passport", features = ["no-entrypoint"] }
